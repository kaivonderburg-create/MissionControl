name: dynamicOS Scan Pro Android APK
on:
  push:
    branches: [dynamicOS-scanpro-v10]
    paths:
      - 'sfd2-android/**'
      - '.github/workflows/dynamicos-sfd2-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Vorhandenes Android SDK prüfen
        run: |
          echo "SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" | tail -15
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35 sicherstellen
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: APK bauen
        run: gradle --no-daemon --stacktrace -p sfd2-android :app:assembleDebug
      - name: APK prüfen
        run: test -s sfd2-android/app/build/outputs/apk/debug/app-debug.apk && sha256sum sfd2-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-ScanPro-v10-APK
          path: sfd2-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Direktdownload-APK auf Branch ablegen
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p sfd2-android/releases
          cp sfd2-android/app/build/outputs/apk/debug/app-debug.apk sfd2-android/releases/dynamicOS-ScanPro-v10-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sfd2-android/releases/dynamicOS-ScanPro-v10-debug.apk
          if ! git diff --cached --quiet; then git commit -m 'Build Android APK v10'; git push; fi
