name: dynamicOS AutoConnect F9211B APK

on:
  push:
    branches:
      - dynamicOS-autoconnect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build definition
        uses: actions/checkout@v4

      - name: Fetch pinned Android Auto receiver source
        run: |
          git clone https://github.com/andreknieriem/open-headunit.git receiver
          git -C receiver checkout --detach ae74788d8312dd7a735775ddc21370f1741a7af1

      - name: Apply dynamicOS F9211B identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("receiver")
          replacements = {
              "app/build.gradle.kts": [
                  ('applicationId = "com.andrerinas.headunitrevived"', 'applicationId = "dynamicos.autoconnect"'),
                  ('versionName = "4.0.0-beta2"', 'versionName = "0.2.0-f9211b"'),
              ],
              "settings.gradle.kts": [
                  ('rootProject.name = "open-headunit"', 'rootProject.name = "dynamicOS-AutoConnect"'),
              ],
              "app/src/main/res/values/strings.xml": [
                  ('<string name="app_name">Open Headunit</string>', '<string name="app_name">dynamicOS AutoConnect</string>'),
                  ('<string name="title">Open Headunit</string>', '<string name="title">dynamicOS AutoConnect</string>'),
              ],
              "app/src/main/res/values-de/strings.xml": [
                  ('<string name="app_name">Open Headunit</string>', '<string name="app_name">dynamicOS AutoConnect</string>'),
                  ('<string name="title">Open Headunit</string>', '<string name="title">dynamicOS AutoConnect</string>'),
              ],
          }
          for name, changes in replacements.items():
              path = root / name
              data = path.read_text()
              for old, new in changes:
                  if old not in data:
                      raise SystemExit(f"Expected source missing in {name}: {old}")
                  data = data.replace(old, new)
              path.write_text(data)
          # dynamicOS Bluetooth pairing shortcut for legacy Android 8.1 head units.
          settings_path = root / "app/src/main/java/com/andrerinas/openheadunit/main/SettingsFragment.kt"
          content = settings_path.read_text()
          anchor = '        items.add(SettingItem.SubHeader("bluetooth", R.string.settings_bluetooth))'
          if content.count(anchor) != 1:
              raise SystemExit("Bluetooth settings anchor not found or ambiguous")
          pairing_row = """
        items.add(SettingItem.SettingEntry(
            stableId = "dynamicOsBluetoothPairing",
            nameResId = R.string.dynamicos_bluetooth_pairing,
            value = getString(R.string.dynamicos_bluetooth_pairing_hint),
            onClick = {
                try {
                    startActivity(Intent(SystemSettings.ACTION_BLUETOOTH_SETTINGS))
                } catch (_: ActivityNotFoundException) {
                    Toast.makeText(requireContext(), R.string.dynamicos_bluetooth_settings_unavailable, Toast.LENGTH_LONG).show()
                }
            }
        ))
"""
          settings_path.write_text(content.replace(anchor, anchor + pairing_row))
          translations = {
              "values": [
                  ("dynamicos_bluetooth_pairing", "Pair phone via Bluetooth"),
                  ("dynamicos_bluetooth_pairing_hint", "Open Bluetooth settings, pair the phone with the car radio, then return to start wireless Android Auto."),
                  ("dynamicos_bluetooth_settings_unavailable", "Bluetooth settings are not available on this head unit."),
              ],
              "values-de": [
                  ("dynamicos_bluetooth_pairing", "Smartphone per Bluetooth koppeln"),
                  ("dynamicos_bluetooth_pairing_hint", "Bluetooth-Einstellungen öffnen, Smartphone mit dem Radio koppeln und danach Wireless Android Auto starten."),
                  ("dynamicos_bluetooth_settings_unavailable", "Bluetooth-Einstellungen auf dieser Headunit nicht verfügbar."),
              ],
          }
          for folder, entries in translations.items():
              path = root / "app/src/main/res" / folder / "strings.xml"
              data = path.read_text()
              tags = "\\n".join(f'    <string name="{key}">{value}</string>' for key, value in entries)
              path.write_text(data.replace("<resources>", "<resources>\\n" + tags, 1))
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile installable APK
        working-directory: receiver
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-AutoConnect-F9211B-APK
          path: receiver/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish license and matching source patch instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-AutoConnect-Source-License
          path: |
            receiver/LICENSE
            receiver/COPYRIGHT_MICHAEL_REID_GPLv3AFFERO.txt
            receiver/DYNAMICOS_F9211B.md
          if-no-files-found: warn
