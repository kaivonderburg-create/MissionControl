name: dynamicOS NVR nightly (isolated branch)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - id: detect
        run: |
          if test -f nvr/nvr.py && test -f android/app/build.gradle && test -f appliance/build-iso.sh; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NVR source not uploaded; no build performed" >> "$GITHUB_STEP_SUMMARY"
          fi
  verify:
    needs: source-check
    if: needs.source-check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'fastapi<1' 'httpx<1' 'cryptography>=41' 'uvicorn<1'
      - run: python -m compileall -q nvr appliance tests
      - run: find appliance -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s nvr -p 'test_*.py' -v
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  iso:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-efi-amd64-bin syslinux-common
      - run: sudo bash appliance/build-iso.sh "$RUNNER_TEMP/nvr-iso"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Linux-ISO-UNVERIFIED
          path: ${{ runner.temp }}/nvr-iso/*.iso
          if-no-files-found: error
