name: dynamicOS NVR Debian 13 ISO (isolated source branch)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dynamicos-nvr-nightly.yml'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: dynamicOS-nvr-iso-master
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'fastapi<1' 'httpx<1' 'cryptography>=41' 'uvicorn<1'
      - run: python -m compileall -q nvr appliance tests
      - run: find appliance -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s nvr -p 'test_*.py' -v
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  iso:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynamicos-nvr-automation
      - name: Free runner disk space
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet || true
          df -h .
      - name: Build Debian 13 ISO in disposable privileged container
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p nvr-iso
          docker run --rm --privileged --network host -v "$PWD:/work" -w /work debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y live-build debootstrap xorriso squashfs-tools grub-efi-amd64-bin syslinux-common ca-certificates
            bash appliance/build-iso.sh /work/nvr-iso
          ' 2>&1 | tee nvr-iso/build.log
      - name: Publish diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-ISO-build-log
          path: nvr-iso/build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Validate ISO boot image and SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=(nvr-iso/*.iso)
          test "${#images[@]}" -eq 1
          test "$(stat -c %s "${images[0]}")" -gt 100000000
          xorriso -indev "${images[0]}" -report_el_torito plain
          sha256sum "${images[0]}" > nvr-iso/SHA256SUMS.txt
          echo 'TEST IMAGE ONLY: no production installation authorization.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Debian13-ISO-TEST
          path: nvr-iso/*.iso
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-ISO-SHA256
          path: nvr-iso/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
