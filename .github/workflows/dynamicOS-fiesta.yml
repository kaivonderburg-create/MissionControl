name: Build dynamicOS Fiesta APK
on:
  push:
    branches: [dynamicOS-fiesta]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        run: gradle -p dynamicOS-Fiesta :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-Fiesta-debug-apk
          path: dynamicOS-Fiesta/app/build/outputs/apk/debug/app-debug.apk
